client_max_body_size 2G;

server {
    listen 80;
    server_name ejele.net www.ejele.net coup.ejele.net _;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Keep the current TLS fallback intact until the new certificate is issued.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/mochila-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mochila-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
